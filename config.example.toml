# 灵枢配置文件（可选）
# 位置：~/.lingshu/config.toml（或 LINGSHU_CONFIG 环境变量指定路径）
# 未提供时全部使用默认值；环境变量优先级高于本文件。

[server]
# 监听地址与端口（仅本机使用，不建议暴露到非回环地址）
host = "127.0.0.1"
port = 7430

[database]
# SQLite 数据库文件路径
# path = "~/.lingshu/lingshu.db"

[embedding]
# 硅基流动 API key（也可以用环境变量 SILICONFLOW_API_KEY）
# api_key = "sk-xxx"
# 模型与端点一般不需要改
# model = "BAAI/bge-m3"
# endpoint = "https://api.siliconflow.cn/v1/embeddings"

[backup]
# 备份目录（支持 ~ 展开和相对路径）
dir = "~/.lingshu/backups"
# 每日备份的触发时刻（本地时间 24h 制，时:分）
time = "03:00"
# 备份保留份数（超出轮换删除最旧的）
keep = 7

[scheduler]
# 增量向量化扫描周期（秒）
embed_interval_sec = 30
